on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  publish-npm:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Configure npm time machine registry
        run: npm config set registry https://:2026-03-04T15%3A01%3A56.121000Z@time-machines-npm.sealsecurity.io/
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 16
          registry-url: https://registry.npmjs.org
      - run: yarn install
      # Publishing needs npm OIDC / registry credentials the fork does not have.
      # Pack the identical tarball instead: `dist/` is what prepublishOnly builds.
      - run: node node_modules/rollup/dist/bin/rollup -c
      - run: npm pack --ignore-scripts
      - uses: actions/upload-artifact@v4
        with:
          name: npm-tarball
          path: svgo-*.tgz
          if-no-files-found: error
